<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Deck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span><strong>PokeIdle Multiscreen</strong></div>
      <div class="toolbar-group layout-group" data-mode="grid">
        <button id="layoutGrid" data-layout="grid" class="toolbar-btn active" title="Grade 2×2"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">Grade 2×2</span></button>
        <button id="layoutRow" data-layout="row" class="toolbar-btn" title="Vertical 1×4"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7.5 3v18M12 3v18M16.5 3v18"/></svg><span class="lbl">Vertical 1×4</span></button>
      </div>
        <button id="themeButton" class="toolbar-btn accent" title="Personalizar cores"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/></svg><span class="lbl">Cores</span></button>
      <div id="focusDock" class="focus-dock" aria-label="Selecionar tela principal"></div>
      <span id="resourceStatus" class="resource-status" title="Memória RAM usada pelo aplicativo">RAM —</span>
      <div class="toolbar-group utility-group">
        <button id="extrasButton" class="toolbar-btn" title="TopIdle e lives Kick">⚙ <span class="lbl">Recursos</span></button>
        <button id="extButton" class="toolbar-btn" title="Extensões"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="3" width="7" height="7" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/></svg><span class="lbl">Extensões</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="perfButton" class="toolbar-btn" title="Modo de desempenho"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg><span class="lbl" id="perfLabel">Normal</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="zoom-hud" title="Zoom de todas as contas">
          <button id="zoomOut" aria-label="Diminuir zoom"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="zoomLabel" class="zoom-val" title="Clique para voltar a 100%">100%</button>
          <button id="zoomIn" aria-label="Aumentar zoom"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <button id="fullscreenButton" class="toolbar-btn" title="Tela cheia (F11)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <span class="sep"></span>
        <button id="reloadAll" class="toolbar-btn" title="Recarregar todas as contas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span class="lbl">Todas</span></button>
        <button id="openExternal" class="toolbar-btn" title="Abrir no navegador"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span class="lbl">Navegador</span></button>
        <button id="openTwitchChat" class="toolbar-btn" title="Twitch: presença no chat dos canais oficiais (bônus de XP) e abrir as lives no navegador"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2H3v16h5v4l4-4h5l4-4V2z"/><path d="M11 11V7M16 11V7"/></svg></button>
        <button id="openHuntingGuide" class="toolbar-btn" title="Onde caçar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/></svg><span class="lbl">Onde caçar</span></button>
        <button id="echoButton" class="toolbar-btn" title="Sincronizar cliques entre contas (Echo)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10l-3-3M17 17H7l3 3M17 7l3 3-3 3M7 17l-3-3 3-3"/></svg><span class="lbl">Echo</span></button>


      </div>
    </div>
  </header>
  <script src="renderer.js"></script>
</body>
</html>
