<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Conta</title>
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <div class="account-bar">
    <span class="status-dot" id="dot"></span>
    <span class="account-name" id="name"></span>
    <span class="account-up" id="up"></span>
    <span class="zoom-group">
      <button class="account-action small" data-action="zoom-out" title="Diminuir zoom desta conta"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <span class="account-zoom" id="zoom">100%</span>
      <button class="account-action small" data-action="zoom-in" title="Aumentar zoom desta conta"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </span>
    <button class="account-action small" data-action="mute" id="muteBtn" title="Silenciar esta conta"></button>
    <button class="account-action small" data-action="restock" title="Configurar recompra automática nesta conta">🛒</button>
    <button class="account-action small group-action" data-menu="kick" title="Kick: abrir live com chat ou parar lives">K ▾</button>
    <button class="account-action small group-action" data-menu="tools" title="Ferramentas adicionais: TopIdle e Rotom Sniper">⚒ ▾</button>
    <button class="account-action small" data-action="reload" title="Recarregar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="account-action small" data-action="focus" id="focusBtn" title="Expandir esta conta para ocupar a área principal"></button>
    <button class="account-action small" data-action="hide" title="Esconder (continua rodando)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6A16.8 16.8 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg></button>
    <button class="account-action small" data-action="power" title="Desligar esta conta (descarrega o jogo e libera CPU e memória)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></button>
  </div>
  <script src="bar.js"></script>
</body>
</html>
