<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch · Chat</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="twitch.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="title"><span class="dot"></span><strong>TWITCH · CHAT</strong><span class="ver" id="sum">0 de 4 no chat</span></div>
    </header>

    <section class="card controls">
      <label class="switch big"><input type="checkbox" id="enabled"><i></i><span>Presença no chat ligada</span></label>

    </section>

    <section class="card">
      <h2>Lives no navegador</h2>
      <div class="row">
        <div class="hint grow">Abre todas as lives oficiais que estão no ar em uma aba só do seu navegador. Deixe o painel "Bônus Twitch" aberto na Conta 1 do jogo.</div>
        <button class="btn" id="openLives">Abrir lives</button>
      </div>
    </section>

    <section class="card">
      <h2>Canais oficiais</h2>
      <textarea id="channels" rows="9" spellcheck="false"></textarea>
      <div class="foot"><span class="hint" id="chCount"></span><button id="resetCh" class="btn ghost">Restaurar lista</button></div>
    </section>

    <section class="card">
      <h2>Registro</h2>
      <div class="log" id="log"></div>
    </section>
  </main>
  <script src="twitch-ui.js"></script>
</body>
</html>
