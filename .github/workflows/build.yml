name: Build Night Deck Electron Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Gerar instalador Windows
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v5
        with:
          name: Night-Deck-Windows-Installer
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
