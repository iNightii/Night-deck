<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bar:#111827;--button:#1e293b;--accent:#7c3aed;--text:#f8fafc;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bar);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
header{height:43px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#192235,var(--bar))}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:8px;font-size:12px}.dot{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 3px #7c3aed33,0 0 12px #7c3aedaa}
.group{display:flex;gap:4px;align-items:center}.right{margin-left:auto}
button{height:27px;white-space:nowrap;border:1px solid var(--border);background:var(--button);border-radius:7px;color:var(--text);padding:0 9px;font:600 10px "Segoe UI",Arial;cursor:pointer;display:flex;align-items:center;gap:5px}
button:hover{background:#334155;border-color:#7c3aed}button:active{background:#5b21b6}.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:1200px){.lbl{display:none}.brand{margin-right:0}}
</style></head><body><header>
<div class="brand"><span class="dot"></span><strong>Night Deck</strong></div>
<div class="group">
<button data-cmd="0" title="Grade 2×2"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">Grade 2×2</span></button>
<button data-cmd="1" title="Vertical 1×4"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7.5 3v18M12 3v18M16.5 3v18"/></svg><span class="lbl">Vertical 1×4</span></button>
</div>
<div class="group"><button data-cmd="2" title="Mostrar todas as contas">◉ <span class="lbl">Contas</span></button></div>
<div class="group right">
<button data-cmd="3" title="Sincronizar cliques">⇄ <span class="lbl">Echo</span></button>
<button data-cmd="4" title="Configurar Echo">⚙</button>
<button data-cmd="5" title="Restock">🛒 <span class="lbl">Restock</span></button>
<button data-cmd="6" title="Extensões">▤ <span class="lbl">Extensões</span></button>
<button data-cmd="7" title="Recarregar todas">⟳</button>
<button data-cmd="8" title="Tela cheia">⛶</button>
<button data-cmd="9" title="MultiTwitch">▶ <span class="lbl">MultiTwitch</span></button>
<button data-cmd="10" title="Onde caçar">⌕ <span class="lbl">Onde caçar</span></button>
<button data-cmd="11" title="Atualizações">↻</button>
</div></header>
<script>document.addEventListener('click',e=>{const b=e.target.closest('button[data-cmd]');if(b&&window.chrome?.webview)chrome.webview.postMessage(Number(b.dataset.cmd));});</script>
</body></html>
