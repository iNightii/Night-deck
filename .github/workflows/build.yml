
name: Build Night Deck Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore NightDeck/NightDeck.csproj

      - name: Compilar Night Deck
        run: >
          dotnet publish NightDeck/NightDeck.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: Night-Deck-Windows-x64
          path: publish/
          if-no-files-found: error
