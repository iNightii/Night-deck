name: Build Night Deck Windows - Verificado

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore NightDeck/NightDeck.csproj

      - name: Compilar Night Deck
        run: dotnet publish NightDeck/NightDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Verificar Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            throw 'Microsoft Defender nao esta ativo no runner; publicacao interrompida.'
          }
          Update-MpSignature -ErrorAction Stop
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $scanner)) {
            $scanner = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
            $scanner = Get-ChildItem $scanner -Filter MpCmdRun.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $scanner -or -not (Test-Path $scanner)) { throw 'Scanner do Defender indisponivel.' }
          & $scanner -Scan -ScanType 3 -File (Resolve-Path 'publish').Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender retornou codigo $LASTEXITCODE; publicacao interrompida." }

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          Get-ChildItem publish -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path publish/SHA256SUMS.txt -Encoding ascii

      - name: Publicar somente apos verificacao
        uses: actions/upload-artifact@v4
        with:
          name: Night-Deck-Windows-x64-Verificado
          path: publish/
          if-no-files-found: error
          retention-days: 14
