<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bar:#111827;--button:#1e293b;--accent:#7c3aed;--text:#f8fafc;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bar);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
header{height:43px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#192235,var(--bar))}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:8px;font-size:12px}.dot{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 3px #7c3aed33,0 0 12px #7c3aedaa}
.group{display:flex;gap:4px;align-items:center}.right{margin-left:auto}
.focus-dock{display:flex;align-items:center;gap:4px;flex-shrink:0}.focus-dock button{min-width:34px;justify-content:center}.focus-dock button.active{background:#4c1d95;border-color:#a78bfa}.focus-dock button.hidden-account{opacity:.45;text-decoration:line-through}
.zoom-hud{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex-shrink:0}.zoom-hud button{border:0;border-radius:0;padding:0 8px}.zoom-hud .zoom-val{min-width:44px;justify-content:center;background:#111827;border-left:1px solid var(--border);border-right:1px solid var(--border)}

button{height:27px;white-space:nowrap;border:1px solid var(--border);background:var(--button);border-radius:7px;color:var(--text);padding:0 9px;font:600 10px "Segoe UI",Arial;cursor:pointer;display:flex;align-items:center;gap:5px}
button:hover{background:#334155;border-color:#7c3aed}button:active{background:#5b21b6}
button.selected{background:#5b21b6;border-color:#c4b5fd;color:#fff;box-shadow:inset 0 -3px 0 #ddd6fe,0 0 0 1px #8b5cf6}
button.selected::after{content:"✓";font-size:11px;font-weight:800;color:#fff;margin-left:2px}
button.selected[data-account]::after{content:"●";font-size:9px}
button.selected[data-cmd="3"],button.selected[data-cmd="5"]{background:#065f46;border-color:#34d399;box-shadow:inset 0 -3px 0 #6ee7b7}
button:focus-visible{outline:2px solid #ddd6fe;outline-offset:2px}.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:1200px){.lbl{display:none}.brand{margin-right:0}}
</style></head><body><header>
<div class="brand"><span class="dot"></span><strong>Night Deck</strong></div>
<div class="group">
<button data-cmd="0" title="Grade 2×2"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">Grade 2×2</span></button>
<button data-cmd="1" title="Vertical 1×4"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7.5 3v18M12 3v18M16.5 3v18"/></svg><span class="lbl">Vertical 1×4</span></button>
</div>
<div class="focus-dock" aria-label="Selecionar conta principal">
<button data-account="0" title="Conta 1 — clique para focar, botão direito para ocultar">Conta 1</button>
<button data-account="1" title="Conta 2 — clique para focar, botão direito para ocultar">Conta 2</button>
<button data-account="2" title="Conta 3 — clique para focar, botão direito para ocultar">Conta 3</button>
<button data-account="3" title="Conta 4 — clique para focar, botão direito para ocultar">Conta 4</button>
<button data-cmd="2" title="Voltar para todas as contas">▦ <span class="lbl">Todas</span></button>
</div>
<div class="group right">
<div class="zoom-hud" title="Zoom geral de todas as contas">
<button data-zoom="-10" title="Diminuir zoom geral">−</button>
<button data-zoom="0" id="globalZoomLabel" class="zoom-val" title="Restaurar zoom geral a 100%">90%</button>
<button data-zoom="10" title="Aumentar zoom geral">+</button>
</div>
<button data-cmd="3" title="Sincronizar cliques">⇄ <span class="lbl">Echo</span></button>
<button data-cmd="4" title="Configurar Echo">⚙</button>
<button data-cmd="5" title="Restock">🛒 <span class="lbl">Restock</span></button>
<button data-cmd="6" title="Extensões">▤ <span class="lbl">Extensões</span></button>
<button data-cmd="7" title="Recarregar todas">⟳</button>
<button data-cmd="8" title="Tela cheia">⛶</button>
<button data-cmd="9" title="MultiTwitch">▶ <span class="lbl">MultiTwitch</span></button>
<button data-cmd="10" title="Onde caçar">⌕ <span class="lbl">Onde caçar</span></button>
<button data-cmd="11" title="Atualizações">↻</button>
</div></header>
<script>
const send = data => window.chrome?.webview?.postMessage(data);
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-cmd')) send(Number(b.dataset.cmd));
  else if (b.hasAttribute('data-account')) send({type:'focus', account:Number(b.dataset.account)});
  else if (b.hasAttribute('data-zoom')) send({type:'zoom', delta:Number(b.dataset.zoom)});
});
document.addEventListener('contextmenu', e => {
  const b = e.target.closest('button[data-account]');
  if (!b) return;
  e.preventDefault();
  send({type:'visibility', account:Number(b.dataset.account)});
});
window.chrome?.webview?.addEventListener('message', e => {
  const state = e.data;
  if (!state || state.type !== 'state') return;
  document.querySelectorAll('[data-account]').forEach(b => {
    const i = Number(b.dataset.account);
    b.classList.toggle('active', state.focused === i);
    b.classList.toggle('selected', state.focused === i);
    b.setAttribute('aria-pressed', String(state.focused === i));
    b.classList.toggle('hidden-account', state.visible[i] === false);
  });
  document.querySelectorAll('button[data-cmd="0"],button[data-cmd="1"]').forEach(b => {
    const active = state.focused == null && (Number(b.dataset.cmd) === 0 ? state.layout === '2x2' : state.layout === '1x4');
    b.classList.toggle('selected', active);
    b.setAttribute('aria-pressed', String(active));
  });
  const echo = document.querySelector('button[data-cmd="3"]');
  echo.classList.toggle('selected', !!state.echoEnabled);
  echo.setAttribute('aria-pressed', String(!!state.echoEnabled));
  echo.title = state.echoEnabled ? 'Echo LIGADO — clique para desligar' : 'Echo DESLIGADO — clique para ligar';
  const restock = document.querySelector('button[data-cmd="5"]');
  restock.classList.toggle('selected', !!state.restockEnabled);
  restock.setAttribute('aria-pressed', String(!!state.restockEnabled));
  restock.title = state.restockEnabled ? 'Restock ativo em pelo menos uma conta — configurar' : 'Restock desativado — configurar';
  document.getElementById('globalZoomLabel').textContent = state.zoom + '%';
});
send({type:'ready'});
</script>
</body></html>
