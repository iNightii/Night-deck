name: Build Night Deck Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore NightDeck/NightDeck.csproj

      - name: Compilar Night Deck
        run: dotnet publish NightDeck/NightDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Gravar identificador da compilacao
        shell: pwsh
        run: Set-Content -Path publish/build-id.txt -Value "${{ github.run_id }}" -Encoding ascii

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          Get-ChildItem publish -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path publish/SHA256SUMS.txt -Encoding ascii

      - name: Empacotar atualizacao
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Night-Deck-Windows-x64.zip -Force

      - name: Publicar release para atualizacao automatica
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_id }}"
          gh release create $tag Night-Deck-Windows-x64.zip --repo "${{ github.repository }}" --title "Night Deck $tag" --notes "Compilacao automatica do Night Deck." --latest

